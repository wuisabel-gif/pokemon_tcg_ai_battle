<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" role="img" aria-labelledby="title desc">
  <title id="title">Replay to MCTS research pipeline</title>
  <desc id="desc">Replay JSON becomes episode records, behavior-cloning data, a policy/value model, bounded PUCT MCTS, baseline evaluation, and a promotion gate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker>
    <style>
      .box{fill:#eaf2f8;stroke:#2563eb;stroke-width:2;rx:14}
      .gate{fill:#fff4d6;stroke:#d97706;stroke-width:2}
      .text{font:21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43;text-anchor:middle}
      .small{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#486581;text-anchor:middle}
      .arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="920" height="760" fill="#ffffff"/>
  <rect class="box" x="310" y="25" width="300" height="65"/>
  <text class="text" x="460" y="65">Replay JSON</text>
  <path class="arrow" d="M460 90 L460 125"/>
  <rect class="box" x="310" y="125" width="300" height="65"/>
  <text class="text" x="460" y="165">Episode records</text>
  <path class="arrow" d="M460 190 L460 225"/>
  <rect class="box" x="310" y="225" width="300" height="65"/>
  <text class="text" x="460" y="265">Behavior-cloning data</text>
  <path class="arrow" d="M460 290 L460 325"/>
  <rect class="box" x="310" y="325" width="300" height="65"/>
  <text class="text" x="460" y="365">Policy/value model</text>
  <path class="arrow" d="M460 390 L460 425"/>
  <rect class="box" x="310" y="425" width="300" height="65"/>
  <text class="text" x="460" y="465">Bounded PUCT MCTS</text>
  <path class="arrow" d="M460 490 L460 525"/>
  <rect class="box" x="310" y="525" width="300" height="65"/>
  <text class="text" x="460" y="565">Baseline evaluation</text>
  <path class="arrow" d="M460 590 L460 625"/>
  <polygon class="gate" points="460,625 565,685 460,745 355,685"/>
  <text class="text" x="460" y="692">Improvement gate?</text>
  <path class="arrow" d="M355 685 C180 685 180 257 310 257"/>
  <text class="small" x="195" y="470">Fail: investigate</text>
  <path class="arrow" d="M565 685 L760 685 L760 80 L610 80"/>
  <text class="small" x="770" y="390" transform="rotate(90 770 390)">Pass: candidate submission</text>
</svg>
