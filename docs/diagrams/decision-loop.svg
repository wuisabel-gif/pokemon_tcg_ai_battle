<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent decision loop</title>
  <desc id="desc">Game observation flows to legal action set, deck-conditioned policy, selected action, and game engine, which returns the next observation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker>
    <style>
      .box{fill:#eaf2f8;stroke:#2563eb;stroke-width:2;rx:14}
      .text{font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43;text-anchor:middle}
      .arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <rect class="box" x="230" y="30" width="300" height="70"/>
  <text class="text" x="380" y="73">Game observation</text>
  <path class="arrow" d="M380 100 L380 145"/>
  <rect class="box" x="230" y="145" width="300" height="70"/>
  <text class="text" x="380" y="188">Legal action set</text>
  <path class="arrow" d="M380 215 L380 260"/>
  <rect class="box" x="230" y="260" width="300" height="70"/>
  <text class="text" x="380" y="303">Deck-conditioned policy</text>
  <path class="arrow" d="M380 330 L380 375"/>
  <rect class="box" x="230" y="375" width="300" height="70"/>
  <text class="text" x="380" y="418">Selected action</text>
  <path class="arrow" d="M530 410 C680 410 680 65 530 65"/>
  <rect class="box" x="35" y="375" width="150" height="70"/>
  <text class="text" x="110" y="418">Game engine</text>
  <path class="arrow" d="M230 410 L185 410"/>
</svg>
